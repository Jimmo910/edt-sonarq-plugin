name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Caches all of ~/.m2/repository, which is where Tycho keeps the resolved target-platform
          # artifacts (~/.m2/repository/p2). A separate p2 cache step would be redundant.
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
